<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="index.css" />
    <title>Personal Dashboard</title>
  </head>
  <body>
    <main>
      <div class="top">
        <div id="crypto">
          <div id="crypto-top"></div>
        </div>
        <div id="weather"></div>
      </div>
      <div>
        <h1 id="time" class="time"></h1>
        <h2 id="date" class="date"></h1>
      </div>
      <form id="search-form">
        <input type="text" id="search-input" placeholder="Search Google..." />
      </form>

      <div class="bottom-container">
        <p id="author"></p>
        <div id="github-container">
          <img
            id="github-contribution-img"
            alt="github contribution image"
            src="https://ghchart.rshah.org/federicocelia"
          />
        </div>
      </div>
    </main>
    <script src="index.js"></script>
  </body>
</html>
